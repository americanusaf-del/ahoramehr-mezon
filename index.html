<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Alert</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#ff3333;
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;
  display:grid;
  place-items:center;
}

.box{
  width:min(90%,680px);
  padding:32px 22px;
  text-align:center;
  background:#090000;
  border:1px solid #661111;
  border-radius:16px;
  box-shadow:0 0 35px #300;
}

.start-screen{
  width:min(90%,500px);
  padding:45px 20px;
  text-align:center;
  background:#090000;
  border:1px solid #661111;
  border-radius:16px;
  box-shadow:0 0 35px #300;
}

.start-button{
  margin-top:25px;
  padding:16px 45px;
  border:0;
  border-radius:12px;
  background:#d71919;
  color:white;
  font-weight:bold;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 0 20px #900;
}

.icon{
  font-size:70px;
}

h1{
  font-size:clamp(30px,8vw,55px);
  text-shadow:0 0 18px red;
}

p{
  font-size:20px;
  line-height:2;
  color:#ddd;
}

.warning{
  font-size:20px;
  line-height:2;
}

.hacker-image{
  width:min(90%,420px);
  margin-top:20px;
  border-radius:14px;
  box-shadow:0 0 25px #900;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

.terminal{
  margin-top:25px;
  text-align:left;
  direction:ltr;
  background:#000;
  border-radius:10px;
  padding:16px;
  color:#ff5555;
  font:14px/1.8 Consolas,monospace;
  min-height:130px;
}

#warning{
  display:none;
}
</style>
</head>

<body>

<section class="start-screen" id="startScreen">

  <h1 style="font-size:34px;">
    آماده‌ای؟
  </h1>

  <p>
    برای دیدن مزون لباس اهورامهر<br>
    روی دکمه شروع بزن
  </p>

  <button class="start-button" onclick="startPrank()">
    ▶️ شروع
  </button>

</section>


<section class="box" id="warning">

  <div class="icon">⚠️</div>

  <h1>هشدار امنیتی</h1>

  <div class="warning">
    اتصال مشکوک شناسایی شد.<br>
    <b>شما در حال هک شدن هستید!</b>
  </div>

  <img
    src="IMG_6434.jpeg"
    alt="Hacker"
    class="hacker-image"
  >

  <div class="terminal" id="terminal"></div>

</section>


<script>

let audioContext;
let alarmOscillator;
let alarmGain;

function startAlarm(){

  audioContext = new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  alarmOscillator =
    audioContext.createOscillator();

  alarmGain =
    audioContext.createGain();

  alarmOscillator.type = "sawtooth";
  alarmOscillator.frequency.value = 700;

  alarmGain.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  alarmGain.gain.exponentialRampToValueAtTime(
    0.25,
    audioContext.currentTime + 0.08
  );

  alarmOscillator.connect(alarmGain);
  alarmGain.connect(audioContext.destination);

  alarmOscillator.start();

  let high = false;

  const siren = setInterval(() => {

    if(!alarmOscillator) return;

    high = !high;

    alarmOscillator.frequency.setValueAtTime(
      high ? 950 : 650,
      audioContext.currentTime
    );

  }, 700);

  setTimeout(() => {

    clearInterval(siren);

    if(alarmGain){

      alarmGain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.3
      );

    }

    if(alarmOscillator){

      alarmOscillator.stop(
        audioContext.currentTime + 0.35
      );

    }

    alarmOscillator = null;

  }, 6000);
}


function startPrank(){

  startAlarm();

  document.getElementById(
    "startScreen"
  ).style.display="none";

  document.getElementById(
    "warning"
  ).style.display="block";

  next();
}


const lines=[
  "[SYSTEM] scanning connection...",
  "[WARN] unusual activity detected",
  "[SCAN] checking device...",
  "[SCAN] checking network...",
  "[ALERT] suspicious activity found",
  "[SYSTEM] displaying security warning..."
];

let i=0;

function next(){

  const box =
    document.getElementById("terminal");

  if(i < lines.length){

    box.innerHTML +=
      lines[i] + "<br>";

    i++;

    setTimeout(next,550);

  }

}

</script>

</body>
</html>
