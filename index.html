<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Alert</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#ff3333;
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.start-screen,
.box{
  width:min(90%,680px);
  padding:32px 22px;
  text-align:center;
  background:#090000;
  border:1px solid #661111;
  border-radius:16px;
  box-shadow:0 0 35px #300;
}

.start-screen{
  width:min(90%,500px);
  padding:45px 20px;
}

.start-button{
  margin-top:25px;
  padding:16px 45px;
  border:0;
  border-radius:12px;
  background:#d71919;
  color:white;
  font-weight:bold;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 0 20px #900;
}

.start-button:active{
  transform:scale(.96);
}

.icon{
  font-size:70px;
}

h1{
  font-size:clamp(30px,8vw,55px);
  text-shadow:0 0 18px red;
}

p{
  font-size:20px;
  line-height:2;
  color:#ddd;
}

.warning{
  font-size:20px;
  line-height:2;
}

.hacker-image{
  width:min(90%,420px);
  margin:20px auto 0;
  border-radius:14px;
  box-shadow:0 0 25px #900;
  display:block;
}

.terminal{
  margin-top:25px;
  text-align:left;
  direction:ltr;
  background:#000;
  border-radius:10px;
  padding:16px;
  color:#ff5555;
  font:14px/1.8 Consolas,monospace;
  min-height:130px;
}

#warning{
  display:none;
}

/* صفحه ترسناک آخر */
#scare{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  place-items:center;
}

#scare.show{
  display:grid;
  animation:flash .12s infinite alternate;
}

.scary-face{
  font-size:min(55vw,320px);
  filter:drop-shadow(0 0 25px red);
  animation:
    scaryShake .08s infinite,
    scaryZoom .7s ease-out;
}

@keyframes scaryShake{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-12px,8px) rotate(-3deg)}
  50%{transform:translate(12px,-8px) rotate(3deg)}
  75%{transform:translate(-8px,-5px) rotate(-2deg)}
  100%{transform:translate(8px,5px) rotate(2deg)}
}

@keyframes scaryZoom{
  from{
    transform:scale(.2);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes flash{
  from{background:#000}
  to{background:#170000}
}

body.shake{
  animation:bodyShake .07s infinite;
}

@keyframes bodyShake{
  0%{transform:translate(0)}
  25%{transform:translate(-5px,4px)}
  50%{transform:translate(5px,-4px)}
  75%{transform:translate(-4px,-3px)}
  100%{transform:translate(4px,3px)}
}
</style>
</head>

<body>

<section class="start-screen" id="startScreen">

  <h1 style="font-size:34px;">
    آماده‌ای؟
  </h1>

  <p>
    برای دیدن مزون لباس اهورامهر<br>
    روی دکمه شروع بزن
  </p>

  <button class="start-button" onclick="startPrank()">
    ▶️ شروع
  </button>

</section>


<section class="box" id="warning">

  <div class="icon">⚠️</div>

  <h1>هشدار امنیتی</h1>

  <div class="warning">
    اتصال مشکوک شناسایی شد.<br>
    <b>شما در حال هک شدن هستید!</b>
  </div>

  <img
    src="IMG_6434.jpeg"
    alt="Hacker"
    class="hacker-image"
  >

  <div class="terminal" id="terminal"></div>

</section>


<!-- افکت ترسناک پایانی -->
<section id="scare">
  <div class="scary-face">👹</div>
</section>


<script>

let audioContext;
let alarmOscillator;
let alarmGain;


/* =========================
   لرزش گوشی
========================= */

function vibratePhone(pattern){

  if("vibrate" in navigator){

    try{
      navigator.vibrate(pattern);
    }catch(e){}

  }

}


/* =========================
   صدای آژیر
========================= */

function startAlarm(){

  try{

    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    alarmOscillator =
      audioContext.createOscillator();

    alarmGain =
      audioContext.createGain();

    alarmOscillator.type = "sawtooth";

    alarmOscillator.frequency.value = 700;

    alarmGain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );

    alarmGain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.08
    );

    alarmOscillator.connect(alarmGain);

    alarmGain.connect(
      audioContext.destination
    );

    alarmOscillator.start();

    let high = false;

    const siren = setInterval(() => {

      if(!alarmOscillator) return;

      high = !high;

      alarmOscillator.frequency.setValueAtTime(
        high ? 950 : 650,
        audioContext.currentTime
      );

    },700);


    setTimeout(() => {

      clearInterval(siren);

      if(alarmGain){

        alarmGain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + 0.3
        );

      }

      if(alarmOscillator){

        alarmOscillator.stop(
          audioContext.currentTime + 0.35
        );

      }

      alarmOscillator = null;

    },6000);

  }catch(e){

    /* اگر مرورگر صدا را پشتیبانی نکند،
       بقیه افکت‌ها همچنان اجرا می‌شوند. */

  }

}


/* =========================
   شروع اصلی
========================= */

function startPrank(){

  /* صدا دقیقاً با کلیک کاربر */
  startAlarm();


  /* لرزش هم دقیقاً با همان کلیک */
  vibratePhone([
    300,
    120,
    300,
    120,
    500
  ]);


  document.getElementById(
    "startScreen"
  ).style.display="none";


  document.getElementById(
    "warning"
  ).style.display="block";


  next();

}


/* =========================
   نوشته‌های ترمینال
========================= */

const lines=[

  "[SYSTEM] scanning connection...",

  "[WARN] unusual activity detected",

  "[SCAN] checking device...",

  "[SCAN] checking network...",

  "[ALERT] suspicious activity found",

  "[SYSTEM] displaying security warning..."

];

let i=0;


function next(){

  const box =
    document.getElementById("terminal");


  if(i < lines.length){

    box.innerHTML +=
      lines[i] + "<br>";

    i++;

    setTimeout(
      next,
      550
    );

  }else{

    /* بعد از تمام شدن نوشته‌ها */
    setTimeout(
      scaryEnding,
      1000
    );

  }

}


/* =========================
   افکت ترسناک پایانی
========================= */

function scaryEnding(){

  const scare =
    document.getElementById("scare");


  scare.classList.add("show");


  /* لرزش شدید گوشی */
  vibratePhone([
    150,
    70,
    150,
    70,
    250,
    80,
    400,
    80,
    500
  ]);


  /* لرزش تصویری صفحه */
  document.body.classList.add("shake");


  /* بعد از چند ثانیه پایان */
  setTimeout(() => {

    navigator.vibrate?.(0);

    document.body.classList.remove("shake");

  },3500);

}

</script>

</body>
</html>
